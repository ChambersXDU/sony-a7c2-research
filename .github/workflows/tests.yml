name: Unit tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pycryptodomex pyyaml -r requirements-forensics.txt
      - run: python fwtool.py --help
      - run: python -m unittest discover -s tests -v
